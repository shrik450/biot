# Runs the server image with the identity, certificate, and storage material it needs.
#
# This is a person's server on one host, not a production deployment. It publishes loopback ports
# and expects the operator to supply an OIDC provider, the control-link certificates, an SSH host
# key, and the secrets in docker/server/.env (see .env.example). The image is built from the
# repository root, so run compose from this directory: `docker compose up --build`.
name: biot-server

services:
  server:
    # Podman users: build the image first with `podman build --format docker ...`; Podman's default
    # OCI image format drops the image's HEALTHCHECK. See the README.
    build:
      context: ../..
      dockerfile: docker/server/Dockerfile
    image: biot-server:local
    restart: unless-stopped
    ports:
      # Loopback by default. Change a bind address when a node or an SSH client on another host
      # must reach that listener. The container-side ports are fixed and match the settings below.
      - "127.0.0.1:${BIOT_HTTP_PORT:-4000}:4000"
      - "127.0.0.1:${BIOT_SSH_HOST_PORT:-2222}:2222"
      - "127.0.0.1:${BIOT_CONTROL_HOST_PORT:-4443}:4443"
    environment:
      # Identity is the operator's OIDC provider. Biot is not an identity provider and has no other
      # way in, so these four values are required and the issuer must be HTTPS.
      BIOT_OIDC_ISSUER: ${BIOT_OIDC_ISSUER:?set BIOT_OIDC_ISSUER to your provider's HTTPS issuer URL in docker/server/.env}
      BIOT_OIDC_CLIENT_ID: ${BIOT_OIDC_CLIENT_ID:?set BIOT_OIDC_CLIENT_ID in docker/server/.env}
      BIOT_OIDC_CLIENT_SECRET: ${BIOT_OIDC_CLIENT_SECRET:?set BIOT_OIDC_CLIENT_SECRET in docker/server/.env}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE (mise exec -- mix phx.gen.secret) in docker/server/.env}
      PHX_HOST: ${PHX_HOST:-localhost}
      BIOT_SERVER_PUBLICATION_DOMAIN: ${BIOT_SERVER_PUBLICATION_DOMAIN:-preview.localhost}
      # Paths inside the container. The database lives on the named volume; the key material is the
      # operator's, mounted read-only.
      BIOT_SERVER_DATABASE: /var/lib/biot/server.sqlite3
      BIOT_SSH_ADVERTISED_HOST: ${PHX_HOST:-localhost}
      BIOT_SSH_PORT: "2222"
      BIOT_SSH_HOST_KEY_FILE: /etc/biot/ssh-host-key
      BIOT_CONTROL_CERTFILE: /etc/biot/server-cert.pem
      BIOT_CONTROL_KEYFILE: /etc/biot/server-key.pem
      BIOT_CONTROL_CACERTFILE: /etc/biot/ca.pem
      BIOT_CONTROL_PORT: "4443"
      PORT: "4000"
    volumes:
      - biot-data:/var/lib/biot
      # The Z option relabels the directory for SELinux hosts and is ignored elsewhere. The files
      # must be readable by the container's uid 10001; see the README.
      - ./etc:/etc/biot:ro,Z

volumes:
  biot-data:
