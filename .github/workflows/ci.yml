name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: ${{ runner.os }}-mix-${{ hashFiles('flake.lock', 'mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - run: nix develop --command mix setup
      - run: nix develop --command mix check
      - run: nix develop --command mix test --exclude podman --warnings-as-errors

      - run: nix develop --command bash -c 'cd cli && go build ./...'
      - run: nix develop --command bash -c 'cd cli && go vet ./...'
      - run: nix develop --command bash -c 'cd agent && go vet ./...'
      - run: nix develop --command bash -c 'cd agent && go test ./...'

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker/linux-host/run-tests.sh
